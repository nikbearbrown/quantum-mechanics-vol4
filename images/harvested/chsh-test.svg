<svg role="img" aria-labelledby="t-chsh d-chsh" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-chsh">Bell / CHSH test setup</title>
  <desc id="d-chsh">A source emits entangled pairs to two distant detectors. Alice chooses between settings a1 and a2; Bob between b1 and b2. The CHSH combination S is bounded by 2 for local realism but reaches 2 root 2 in quantum mechanics.</desc>
  <metadata><provenance>CANDIDATE &amp;#183; CAJAL PALETTE &amp;#183; QM VOL 4</provenance></metadata>
  <defs>
    <marker id="ar-ch" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="28" y="34" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Bell / CHSH Test Setup</text>

  <rect x="28" y="52" width="504" height="216" fill="#F5F5F5" stroke="#D4D4D4"/>

  <!-- source -->
  <rect x="256" y="142" width="48" height="36" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="280" y="165" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">src</text>
  <text x="280" y="200" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">&#934;&#8314; pairs</text>

  <!-- photon paths -->
  <line x1="256" y1="160" x2="150" y2="160" stroke="#545454" stroke-width="1" marker-end="url(#ar-ch)"/>
  <line x1="304" y1="160" x2="410" y2="160" stroke="#545454" stroke-width="1" marker-end="url(#ar-ch)"/>

  <!-- Alice detector -->
  <rect x="74" y="124" width="60" height="72" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="104" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Alice</text>
  <!-- analyzer angle dial -->
  <circle cx="104" cy="160" r="22" fill="#F5F5F5" stroke="#787878" stroke-width="1"/>
  <line x1="104" y1="160" x2="120" y2="146" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="104" y="210" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">a&#8321;,a&#8322;</text>

  <!-- Bob detector -->
  <rect x="426" y="124" width="60" height="72" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="456" y="116" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Bob</text>
  <circle cx="456" cy="160" r="22" fill="#F5F5F5" stroke="#787878" stroke-width="1"/>
  <line x1="456" y1="160" x2="470" y2="172" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="456" y="210" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">b&#8321;,b&#8322;</text>

  <!-- outcomes -->
  <text x="104" y="234" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">outcome &#177;1</text>
  <text x="456" y="234" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">outcome &#177;1</text>

  <!-- CHSH formula and bound -->
  <text x="40" y="300" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#2a1a0e">S = E(a&#8321;,b&#8321;) + E(a&#8321;,b&#8322;) + E(a&#8322;,b&#8321;) &#8722; E(a&#8322;,b&#8322;)</text>
  <text x="40" y="326" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#545454">local realism:  |S| &#8804; 2</text>
  <text x="40" y="348" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="12" fill="#C8102E">quantum (Tsirelson):  |S| = 2&#8730;2 &#8776; 2.83</text>

  
</svg>
