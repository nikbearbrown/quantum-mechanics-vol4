<svg role="img" aria-labelledby="t-ec d-ec" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-ec">The 3-qubit bit-flip code</title>
  <desc id="d-ec">One logical qubit is encoded into three physical qubits using two CNOTs. Parity stabilizers Z1Z2 and Z2Z3 are measured into ancillas, yielding a syndrome that locates a single bit-flip without collapsing the encoded state.</desc>
  <metadata><provenance>CANDIDATE &amp;#183; CAJAL PALETTE &amp;#183; QM VOL 4</provenance></metadata>
  <defs>
    <marker id="ar-ec" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="28" y="34" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">The 3-Qubit Bit-Flip Code</text>

  <rect x="28" y="52" width="320" height="216" fill="#F5F5F5" stroke="#D4D4D4"/>
  <!-- encoding circuit -->
  <line x1="110" y1="86" x2="330" y2="86" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="110" y1="126" x2="330" y2="126" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="110" y1="166" x2="330" y2="166" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="88" y="90" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">|&#968;&#10217;</text>
  <text x="88" y="130" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">|0&#10217;</text>
  <text x="88" y="170" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">|0&#10217;</text>
  <!-- CNOT 1->2 -->
  <line x1="150" y1="86" x2="150" y2="126" stroke="#2a1a0e" stroke-width="1.5"/>
  <circle cx="150" cy="86" r="5" fill="#2a1a0e"/>
  <circle cx="150" cy="126" r="11" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="150" y1="115" x2="150" y2="137" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="139" y1="126" x2="161" y2="126" stroke="#2a1a0e" stroke-width="1.5"/>
  <!-- CNOT 1->3 -->
  <line x1="190" y1="86" x2="190" y2="166" stroke="#2a1a0e" stroke-width="1.5"/>
  <circle cx="190" cy="86" r="5" fill="#2a1a0e"/>
  <circle cx="190" cy="166" r="11" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="190" y1="155" x2="190" y2="177" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="179" y1="166" x2="201" y2="166" stroke="#2a1a0e" stroke-width="1.5"/>
  <!-- error (red must-look) -->
  <rect x="252" y="110" width="32" height="32" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
  <text x="268" y="132" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="13" fill="#C8102E">X</text>
  <text x="268" y="104" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="9" fill="#C8102E">flip q2</text>
  <text x="190" y="196" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">&#945;|000&#10217;+&#946;|111&#10217;</text>
  <text x="184" y="248" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">encode, then a single X error</text>

  <!-- syndrome table -->
  <rect x="368" y="52" width="164" height="216" fill="#F5F5F5" stroke="#D4D4D4"/>
  <text x="450" y="74" text-anchor="middle" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="12" fill="#2a1a0e">Syndrome</text>
  <text x="384" y="98" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#2a1a0e">Z&#8321;Z&#8322; Z&#8322;Z&#8323;  error</text>
  <line x1="380" y1="104" x2="520" y2="104" stroke="#D4D4D4"/>
  <text x="384" y="124" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">+1   +1   none</text>
  <text x="384" y="146" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">&#8722;1   +1   X&#8321;</text>
  <text x="384" y="168" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#C8102E">&#8722;1   &#8722;1   X&#8322;</text>
  <text x="384" y="190" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">+1   &#8722;1   X&#8323;</text>
  <text x="450" y="222" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">measure parity,</text>
  <text x="450" y="238" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">not the qubits</text>

  <text x="40" y="300" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">|0&#772;&#10217;=|000&#10217;, |1&#772;&#10217;=|111&#10217;.  Stabilizers Z&#8321;Z&#8322;, Z&#8322;Z&#8323; reveal which qubit flipped.</text>
  <text x="40" y="322" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Corrects any single bit-flip; protects phase too when concatenated (Shor 9-qubit).</text>
  
</svg>
