<svg role="img" aria-labelledby="t-tele d-tele" viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg">
  <title id="t-tele">Quantum teleportation protocol</title>
  <desc id="d-tele">Alice entangles her unknown qubit with half of a shared Bell pair, measures both in the Bell basis, and sends two classical bits to Bob, who applies conditional X and Z corrections to recover the state.</desc>
  <metadata><provenance>CANDIDATE &amp;#183; CAJAL PALETTE &amp;#183; QM VOL 4</provenance></metadata>
  <defs>
    <marker id="ar-te" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2a1a0e"/></marker>
  </defs>
  <rect x="0" y="0" width="560" height="400" fill="#FFFFFF"/>
  <text x="28" y="34" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="16" fill="#2a1a0e">Quantum Teleportation Protocol</text>

  <rect x="28" y="56" width="504" height="246" fill="#F5F5F5" stroke="#D4D4D4"/>

  <!-- three wires -->
  <line x1="120" y1="100" x2="300" y2="100" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="120" y1="160" x2="300" y2="160" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="120" y1="240" x2="500" y2="240" stroke="#2a1a0e" stroke-width="1.5"/>

  <text x="86" y="104" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">|&#968;&#10217;</text>
  <text x="80" y="164" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">A</text>
  <text x="80" y="244" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">B</text>

  <!-- shared Bell pair bracket -->
  <text x="100" y="206" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#545454">&#934;&#8314;</text>
  <path d="M108 162 q-8 38 0 76" fill="none" stroke="#787878" stroke-width="1"/>

  <!-- CNOT (psi control, A target) -->
  <line x1="160" y1="100" x2="160" y2="160" stroke="#2a1a0e" stroke-width="1.5"/>
  <circle cx="160" cy="100" r="5" fill="#2a1a0e"/>
  <circle cx="160" cy="160" r="11" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="160" y1="149" x2="160" y2="171" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="149" y1="160" x2="171" y2="160" stroke="#2a1a0e" stroke-width="1.5"/>

  <!-- H on psi -->
  <rect x="196" y="82" width="34" height="34" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="213" y="105" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="13" fill="#2a1a0e">H</text>

  <!-- measurement meters -->
  <rect x="256" y="84" width="34" height="32" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <path d="M261 110 a8 8 0 0 1 16 0" fill="none" stroke="#2a1a0e" stroke-width="1.2"/>
  <line x1="269" y1="110" x2="278" y2="96" stroke="#2a1a0e" stroke-width="1.2"/>
  <rect x="256" y="144" width="34" height="32" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <path d="M261 170 a8 8 0 0 1 16 0" fill="none" stroke="#2a1a0e" stroke-width="1.2"/>
  <line x1="269" y1="170" x2="278" y2="156" stroke="#2a1a0e" stroke-width="1.2"/>

  <!-- classical bits (double lines) red must-look -->
  <line x1="290" y1="97" x2="430" y2="97" stroke="#C8102E" stroke-width="1"/>
  <line x1="290" y1="103" x2="430" y2="103" stroke="#C8102E" stroke-width="1"/>
  <line x1="290" y1="157" x2="390" y2="157" stroke="#C8102E" stroke-width="1"/>
  <line x1="290" y1="163" x2="390" y2="163" stroke="#C8102E" stroke-width="1"/>
  <text x="358" y="88" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="10" fill="#C8102E">2 classical bits</text>
  <!-- route down to Bob -->
  <line x1="430" y1="100" x2="430" y2="234" stroke="#C8102E" stroke-width="1"/>
  <line x1="436" y1="100" x2="436" y2="234" stroke="#C8102E" stroke-width="1"/>
  <line x1="390" y1="160" x2="390" y2="234" stroke="#C8102E" stroke-width="1"/>
  <line x1="396" y1="160" x2="396" y2="234" stroke="#C8102E" stroke-width="1"/>

  <!-- Bob corrections -->
  <rect x="378" y="222" width="34" height="36" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="395" y="245" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="13" fill="#2a1a0e">X</text>
  <rect x="420" y="222" width="34" height="36" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="437" y="245" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="13" fill="#2a1a0e">Z</text>
  <text x="490" y="230" text-anchor="end" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#2a1a0e">|&#968;&#10217;</text>

  <text x="40" y="288" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Bell measurement + 2 classical bits + conditional X&#7468;Z&#7468;. No FTL signalling; |&#968;&#10217; not cloned.</text>

  <text x="40" y="326" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="11" fill="#545454">corrections: 00&#8594;I  01&#8594;X  10&#8594;Z  11&#8594;ZX</text>
  
</svg>
